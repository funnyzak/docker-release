name: nginx-server

services:
  nginx:
    # Pin a released tag instead of :latest so deployments are reproducible.
    image: funnyzak/nginx:1.30.4
    restart: on-failure
    ports:
      - "1000:8080"
    environment:
      TZ: Asia/Shanghai
      NGINX_LISTEN_PORT: "8080"
      # Extra modules: uncomment the matching load_module lines in
      # ./conf/nginx.conf (mounted below).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/templates:/etc/nginx/templates:ro
      - ./log/nginx:/var/log/nginx
      # Mount your own site content (read-only):
      # - ./html:/etc/nginx/html:ro
