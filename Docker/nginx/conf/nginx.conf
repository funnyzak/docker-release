# Dynamic modules — all installed under /usr/lib/nginx/modules.
# headers-more is required by the built-in configuration and is always on;
# uncomment the lines for the modules you need.
load_module /usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so;
# load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
# load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;
# load_module /usr/lib/nginx/modules/ngx_http_fancyindex_module.so;
# load_module /usr/lib/nginx/modules/ngx_http_geoip2_module.so;
# load_module /usr/lib/nginx/modules/ngx_http_image_filter_module.so;
# load_module /usr/lib/nginx/modules/ngx_http_xslt_filter_module.so;
# load_module /usr/lib/nginx/modules/ngx_http_perl_module.so;
# load_module /usr/lib/nginx/modules/ngx_mail_module.so;
# load_module /usr/lib/nginx/modules/ngx_stream_module.so;
# load_module /usr/lib/nginx/modules/ngx_stream_geoip2_module.so;

# The master process runs unprivileged in this image; the directive only
# matters when you run the container as root.
# user nginx;

# 'auto' automatically detects the number of CPU cores, which is usually the best practice.
worker_processes  auto;

error_log /var/log/nginx/error.log warn;

pid /run/nginx/nginx.pid;

events {
    # This value should be adjusted based on server memory and file descriptor limits.
    worker_connections  8192;
    # On Linux systems, Nginx typically automatically selects the most
    # efficient event model (like epoll), no need to explicitly specify.
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush     on;

    # safe: no Server header at all, no version or product hints.
    more_clear_headers Server;
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    # Hide further identifying headers emitted by proxied applications
    # (uncomment/extend as needed for your stack):
    # proxy_hide_header X-AspNet-Version;
    # proxy_hide_header X-AspNetMvc-Version;
    # proxy_hide_header X-Runtime;
    # proxy_hide_header X-Version;

    # ---- Optional module examples: uncomment the matching load_module line
    # ---- at the top of this file, then uncomment what you need below.

    # headers-more (always loaded): header rewriting beyond proxy responses.
    # more_set_headers 'X-Frame-Options: SAMEORIGIN';
    # more_clear_headers 'X-Powered-By';

    # Brotli compression (ngx_http_brotli_* load_module lines) — pair with
    # gzip for old clients.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml;
    # brotli_static on;    # serve pre-compressed *.br files
    # gzip on;             # built in
    # gzip_vary on;
    # gzip_types text/plain text/css text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml;

    # GeoIP2 (ngx_http_geoip2_module load_module line) — mount an mmdb
    # database into the container first; GeoLite2-Country.mmdb is enough for
    # country-level checks. The "allow access from China only" example in
    # default.conf builds on this.
    # geoip2 /etc/nginx/geoip2/GeoLite2-Country.mmdb {
    #     auto_reload 5m;
    #     $geoip2_data_country_code default=ZZ source=$remote_addr country iso_code;
    #     $geoip2_data_country_name country names en;
    # }
    # map $geoip2_data_country_code $is_china {
    #     default 0;
    #     CN     1;
    # }

    # SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";

    log_not_found on;

    # Only trust the direct peer by default. If a trusted proxy chain exists,
    # set set_real_ip_from / real_ip_header / real_ip_recursive per site, or
    # override X-Forwarded-For explicitly where the chain is known.
    proxy_set_header Host $host;
    proxy_set_header X-Real-Ip $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-NginX-Proxy true;

    client_max_body_size 20M;                   # Adjust according to actual upload requirements; the default value is usually sufficient if no file uploads are involved.
    client_body_timeout 60s;                    # Appropriately reduce the timeout to prevent resources from being occupied for too long.
    keepalive_timeout 60s;                      # A reasonable keep-alive timeout to avoid excessive connection resource usage.
    client_header_buffer_size 1k;               # Nginx defaults; raise only if clients legitimately send very large headers.
    large_client_header_buffers 4 8k;

    proxy_connect_timeout  60s;                 # Timeout for Nginx to connect to the backend server.
    proxy_send_timeout  60s;                    # Timeout for the backend server to send data back.
    proxy_read_timeout  60s;                    # Timeout for the backend server to respond after a successful connection.

    fastcgi_connect_timeout 60s;                # Specifies the timeout for nginx to connect to the backend FastCGI server.
    fastcgi_send_timeout 60s;                   # Timeout for nginx to send requests to the backend after the handshake is completed.
    fastcgi_read_timeout 60s;                   # Timeout for nginx to receive responses from the backend after the handshake is completed.
    # Note: If your FastCGI scripts might take longer than 60 seconds to execute, you may need to increase fastcgi_read_timeout accordingly.

    include /etc/nginx/conf.d/*.conf;
}

# TCP/UDP proxying (ngx_stream_module) and mail proxying (ngx_mail_module):
# drop configuration files into /etc/nginx/stream.d/*.conf — see the shipped
# stream.conf.example. Only one stream{} / mail{} block is allowed, so keep all
# servers of each kind inside a single file.
include /etc/nginx/stream.d/*.conf;
