name: Promote Snell Stable
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  promote:
    runs-on: ubuntu-latest
    concurrency:
      group: release-funnyzak/snell-server-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify reviewed stable manifests before changing either registry
        run: |
          set -euo pipefail
          version=$(jq -er .version Docker/snell-server/stable-release.json)
          digest=$(jq -er .digest Docker/snell-server/stable-release.json)
          expected=$(jq -c '.platforms | sort' Docker/snell-server/stable-release.json)
          for registry in docker.io ghcr.io; do
            image="$registry/funnyzak/snell-server"
            actual=$(docker buildx imagetools inspect "$image:$version" --format '{{.Manifest.Digest}}')
            test "$actual" = "$digest"
            platforms=$(docker buildx imagetools inspect "$image@$digest" --raw | jq -c '[.manifests[].platform | select(.os == "linux") | .os + "/" + .architecture + (if .variant then "/" + .variant else "" end)] | sort')
            test "$platforms" = "$expected"
          done
      - name: Smoke test stable image on native amd64 runner
        run: |
          set -euo pipefail
          version=$(jq -er .version Docker/snell-server/stable-release.json)
          digest=$(jq -er .digest Docker/snell-server/stable-release.json)
          output=$(docker run --rm --platform linux/amd64 --entrypoint /opt/snell-server/snell-server "docker.io/funnyzak/snell-server@$digest" --version 2>&1)
          printf '%s\n' "$output"
          grep -F "snell-server v$version " <<< "$output"
      - name: Promote exact stable manifests and verify latest
        run: |
          set -euo pipefail
          digest=$(jq -er .digest Docker/snell-server/stable-release.json)
          for registry in docker.io ghcr.io; do
            image="$registry/funnyzak/snell-server"
            docker buildx imagetools create --tag "$image:latest" "$image@$digest"
            actual=$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')
            test "$actual" = "$digest"
          done
